name: Publish macOS App

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify version tag
        shell: bash
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - name: Run regression tests
        shell: bash
        run: |
          if bash test.sh > "$RUNNER_TEMP/test-output.log" 2>&1; then
            cat "$RUNNER_TEMP/test-output.log"
          else
            cat "$RUNNER_TEMP/test-output.log"
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              printf '::error title=Regression test output::%s\n' "$line"
            done < "$RUNNER_TEMP/test-output.log"
            exit 1
          fi

      - name: Build for Apple Silicon and Intel
        run: UNIVERSAL_BUILD=1 bash build.sh

      - name: Package DMG and ZIP
        run: bash scripts/package_app.sh

      - name: Publish downloadable App
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > build/existing-release.json 2>/dev/null; then
            test "$(plutil -extract isDraft raw build/existing-release.json)" = "true"
            gh release upload "$GITHUB_REF_NAME" build/release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/release/* \
              --verify-tag --draft \
              --title "学习休息倒计时 $GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
